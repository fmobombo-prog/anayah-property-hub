<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anayah Gestim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: dark cadastral sidebar + working canvas; lots drawn as parcels, status carried by colour chips */
:root{
  --paper:#eef1ee;--surface:#ffffff;--sunk:#f5f7f5;--ink:#15211f;--muted:#5b6965;--line:#d8dfdb;
  --accent:#1d5b57;--accent-2:#e2eeec;--on-accent:#ffffff;--brass:#9c6d14;--brass-2:#f4ead6;
  --side:#11302d;--side-ink:#e8f0ee;--side-muted:#8fb0ab;--side-hover:#1a403c;
  --ok:#2b7a4b;--ok-2:#e1f0e6;--warn:#a2660e;--warn-2:#f7ebd4;--bad:#b23b33;--bad-2:#f8e0dd;
  --info:#2c5d9a;--info-2:#e0e9f5;--violet:#6a4c9e;--violet-2:#ebe5f5;--mut:#6c7774;--mut-2:#e8ecea;
  --scrim:rgba(10,20,19,.42);--shadow:0 1px 2px rgba(16,32,30,.06),0 10px 30px rgba(16,32,30,.08);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1413;--surface:#151d1c;--sunk:#111817;--ink:#e3ebe8;--muted:#93a49f;--line:#27332f;
  --accent:#5bb2a6;--accent-2:#173533;--on-accent:#04201c;--brass:#d6a84a;--brass-2:#3a2e14;
  --side:#0a100f;--side-ink:#e3ebe8;--side-muted:#7c938e;--side-hover:#16211f;
  --ok:#5cc086;--ok-2:#173726;--warn:#e2a84c;--warn-2:#3b2c12;--bad:#ec7a6e;--bad-2:#3d1d1a;
  --info:#7eaae8;--info-2:#18283e;--violet:#ab92e3;--violet-2:#2a2140;--mut:#8d9a96;--mut-2:#202a28;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1413;--surface:#151d1c;--sunk:#111817;--ink:#e3ebe8;--muted:#93a49f;--line:#27332f;
  --accent:#5bb2a6;--accent-2:#173533;--on-accent:#04201c;--brass:#d6a84a;--brass-2:#3a2e14;
  --side:#0a100f;--side-ink:#e3ebe8;--side-muted:#7c938e;--side-hover:#16211f;
  --ok:#5cc086;--ok-2:#173726;--warn:#e2a84c;--warn-2:#3b2c12;--bad:#ec7a6e;--bad-2:#3d1d1a;
  --info:#7eaae8;--info-2:#18283e;--violet:#ab92e3;--violet-2:#2a2140;--mut:#8d9a96;--mut-2:#202a28;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;color:var(--side-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:18px}
.nav .grp{display:flex;flex-direction:column;gap:2px}
.nav .gl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:0 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);font-size:14px;opacity:.86}
.nav button:hover{background:var(--side-hover);opacity:1}
.nav button[aria-current="page"]{background:var(--side-hover);opacity:1;box-shadow:inset 3px 0 0 var(--brass)}
.nav button:focus-visible{outline:2px solid var(--brass)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 10px;display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}
.dot.local{background:var(--warn)}

.main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:28px 60px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:0 0 4px}
.top h1{font-size:clamp(24px,3vw,32px)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{border:1px solid var(--line);background:var(--warn-2);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:13.5px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.panel h2{font-size:17px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
@media (max-width:1050px){.g-2{grid-template-columns:minmax(0,1fr)}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hl{background:var(--side);border-color:var(--side);color:var(--side-ink)}
.kpi.hl .l,.kpi.hl .s{color:var(--side-muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--mut-2);color:var(--mut)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{background:var(--ok-2);color:var(--ok)}.s-warn{background:var(--warn-2);color:var(--warn)}.s-bad{background:var(--bad-2);color:var(--bad)}
.s-info{background:var(--info-2);color:var(--info)}.s-violet{background:var(--violet-2);color:var(--violet)}.s-mut{background:var(--mut-2);color:var(--mut)}
.ex{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);border:1px dashed var(--brass);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td .sub{display:block;color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:4px;background:var(--mut-2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13.5px;min-width:0}
.filters input{flex:1 1 200px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent-2);color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--muted)}
.card h3{font-size:17px}
.card .meta{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-variant-numeric:tabular-nums;font-size:14.5px}
.stack{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--mut-2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.f-Disponible{background:var(--ok)}.f-Réservé{background:var(--warn)}.f-Vendu{background:var(--info)}.f-Loué{background:var(--violet)}.f-Indisponible{background:var(--mut)}

.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.li .t span{color:var(--muted);font-size:12.5px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:17px}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line)}
.c-v{fill:var(--accent)}.c-l{fill:var(--brass)}.c-a{fill:var(--info)}
.lg-v{background:var(--accent)}.lg-l{background:var(--brass)}.lg-a{background:var(--info)}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font-size:14px;display:flex;justify-content:space-between}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.tk b{font-size:14px;overflow-wrap:anywhere}
.tk .meta{font-size:12px;color:var(--muted)}
.tk .row{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}

.plan{display:flex;flex-direction:column;gap:10px}
.ilot{display:flex;gap:10px;align-items:flex-start}
.ilot>span{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:56px;flex:none;padding-top:8px}
.plots{display:flex;flex-wrap:wrap;gap:4px}
.plot{all:unset;cursor:pointer;width:44px;height:34px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:#fff;font-weight:600;outline-offset:2px}
.plot:focus-visible{outline:2px solid var(--ink)}
.plot:hover{filter:brightness(1.1)}

.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.mo{border-radius:8px;padding:6px 8px;font-size:11.5px;display:flex;flex-direction:column;gap:2px}
.mo b{font-size:12px}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line)}
.dh{padding:18px 22px;padding-top:calc(18px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{font-size:21px}
.db{padding:18px 22px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.db h3{font-size:15px;margin-bottom:8px}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:20px;color:var(--muted);flex:none}
.x:hover{background:var(--sunk)}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(640px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:22px;box-shadow:var(--shadow);position:relative;z-index:1}
.mbox.wide{width:min(760px,100%)}
.mbox h2{font-size:20px;margin-bottom:14px}
.helpbtn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--sunk);color:var(--muted);font-size:16px;font-weight:700;flex:none}
.helpbtn:hover{color:var(--ink);border-color:var(--brass)}
.helpbtn:focus-visible{outline:2px solid var(--brass)}
.man h3{font-size:14.5px;margin:18px 0 6px;color:var(--ink)}
.man h3:first-of-type{margin-top:6px}
.man p,.man li{font-size:13.5px;line-height:1.55;color:var(--muted)}
.man ul{margin:4px 0 0;padding-left:18px}
.man b{color:var(--ink)}
.form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.fld.half{grid-column:auto}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:9px 11px;font-size:14px;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--muted)}
.formbar{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.err{color:var(--bad);font-size:13px;margin-top:10px}
@media (max-width:560px){.form .grid2{grid-template-columns:1fr}.fld.half{grid-column:1/-1}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:40;max-width:calc(100% - 32px)}

.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sumrow div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.sumrow span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sumrow b{font-variant-numeric:tabular-nums;font-size:16px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:10;padding:12px 16px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav .grp{flex-direction:row;gap:4px}
  .nav .gl{display:none}
  .nav button{white-space:nowrap;padding:7px 10px;font-size:13px}
  .side .foot{display:none}
  .main{padding-block:20px 50px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="15" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="18" y="1" width="15" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="1" y="18" width="15" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="18" y="18" width="15" height="15" rx="2" fill="#c9962f"/></svg>
      <div><b>Anayah Gestim</b><small>Gestion immobilière</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Modules"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><p class="eyebrow" id="eyebrow"></p><h1 id="title">Anayah Gestim</h1></div>
      <div class="actions" id="actions"></div>
      <button class="helpbtn" data-a="aide" aria-label="Aide — ouvrir le manuel de l’utilisateur" title="Aide">?</button>
    </header>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const z2 = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const TODAY = iso(new Date()), THIS_MONTH = TODAY.slice(0, 7), THIS_YEAR = TODAY.slice(0, 4);
const num = v => Number(v) || 0;
function addMonths(d, n) { const [y, m, dd] = d.split('-').map(Number); const t = new Date(y, m - 1 + n, 1); const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); t.setDate(Math.min(dd || 1, last)); return iso(t); }
function monthsBetween(a, b) { const out = []; let [y, m] = a.split('-').map(Number); const [y2, m2] = b.split('-').map(Number); while ((y < y2 || (y === y2 && m <= m2)) && out.length < 600) { out.push(y + '-' + z2(m)); m++; if (m > 12) { m = 1; y++; } } return out; }
const nf = new Intl.NumberFormat('fr-FR', {maximumFractionDigits: 0});
const money = v => nf.format(Math.round(num(v))) + ' ' + esc(CFG.devise || '');
const moneyShort = v => { v = num(v); if (Math.abs(v) >= 1e9) return (v / 1e9).toFixed(1).replace('.', ',') + ' Md'; if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1).replace('.', ',') + ' M'; if (Math.abs(v) >= 1e3) return Math.round(v / 1e3) + ' k'; return String(Math.round(v)); };
const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('fr-FR', {day: '2-digit', month: 'short', year: 'numeric'}) : '—';
const fmtMonth = m => m ? new Date(m + '-01T00:00').toLocaleDateString('fr-FR', {month: 'short', year: 'numeric'}) : '—';
const pct = v => Math.round(v * 100) + ' %';

/* ---------- données ---------- */
const COLS = ['cites', 'lots', 'tiers', 'ventes', 'baux', 'espaces', 'charges', 'cotisations', 'interventions'];

function dbError(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') { READONLY = true; schedule(); return 'Votre accès à cette application est en lecture seule.'; }
  if (c === 'quota_exceeded') return 'La base de données est pleine. Supprimez des enregistrements anciens.';

  return 'Enregistrement impossible pour le moment. Réessayez.';
}
async function save(col, obj) {
  if (READONLY) { toast('Votre accès est en lecture seule.'); return null; }
  const id = obj.id || uid(); const body = {...obj}; delete body.id; body.maj = new Date().toISOString();
  if (MODE === 'cloud') {
    try { await DB.collection(col).doc(id).set(body); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); try { await DB.collection(col).doc(id).set(body); return id; } catch (e2) { toast(dbError(e2)); return null; } }
      toast(dbError(e)); return null;

    const i = S[col].findIndex(x => x.id === id); const rec = {id, ...body};

}

function venteCalc(v) {
  const prix = num(v.prix), ac = Math.min(num(v.acompte), prix);
  const paid = (v.paiements || []).reduce((s, p) => s + num(p.montant), 0);
  const sched = [];
  if (v.mode === 'Échelonné' && num(v.nbEcheances) > 0) {
    const n = Math.round(num(v.nbEcheances)), rest = prix - ac, base = Math.floor(rest / n);
    if (ac > 0) sched.push({label: 'Acompte', date: v.date || TODAY, montant: ac});
    const start = v.premiere || addMonths(v.date || TODAY, 1);
    for (let i = 0; i < n; i++) sched.push({label: `Mensualité ${i + 1}/${n}`, date: addMonths(start, i), montant: i === n - 1 ? rest - base * (n - 1) : base});
  } else sched.push({label: 'Paiement comptant', date: v.date || TODAY, montant: prix});
  let pool = paid;
  sched.forEach(e => { const c = Math.min(pool, e.montant); pool -= c; e.paye = c; e.etat = c >= e.montant - .5 ? 'Payée' : e.date <= TODAY ? (c > 0 ? 'Partielle' : 'En retard') : (c > 0 ? 'Partielle' : 'À venir'); });
  const du = sched.filter(e => e.date <= TODAY).reduce((s, e) => s + e.montant, 0);
  const retard = Math.max(0, du - paid), reste = Math.max(0, prix - paid);
  const statut = reste <= .5 ? 'Soldé' : retard > .5 ? 'En retard' : 'En cours';
  return {prix, paid, reste, retard, sched, statut, next: sched.find(e => e.etat !== 'Payée'), ratio: prix ? Math.min(1, paid / prix) : 0};
}
function bailCalc(b) {
  const mens = num(b.loyer) + num(b.charges);
  const startM = (b.debut || TODAY).slice(0, 7);
  let endM = THIS_MONTH;
  if (num(b.duree) > 0) { const f = addMonths(b.debut || TODAY, num(b.duree) - 1).slice(0, 7); if (f < endM) endM = f; }
  if (b.statut !== 'Actif' && b.resil) { const r = b.resil.slice(0, 7); if (r < endM) endM = r; }
  const months = startM <= endM ? monthsBetween(startM, endM) : [];
  const paidBy = {}; (b.paiements || []).forEach(p => paidBy[p.mois] = (paidBy[p.mois] || 0) + num(p.montant));
  const rows = months.map(m => { const p = paidBy[m] || 0; return {m, p, etat: p >= mens - .5 ? 'Payé' : p > 0 ? 'Partiel' : 'Impayé'}; });
  const du = months.length * mens, paidIn = rows.reduce((s, r) => s + r.p, 0);
  const paid = (b.paiements || []).reduce((s, p) => s + num(p.montant), 0);
  const impaye = Math.max(0, du - paidIn);
  const first = rows.find(r => r.etat !== 'Payé');
  const nextMonth = first ? first.m : addMonths((months[months.length - 1] || startM) + '-01', months.length ? 1 : 0).slice(0, 7);
  const actifCeMois = b.statut === 'Actif' && startM <= THIS_MONTH && months.includes(THIS_MONTH);
  return {mens, rows, du, paid, impaye, first, nextMonth, actifCeMois, nbImp: rows.filter(r => r.etat !== 'Payé').length};
}
function allPayments() {

        <div class="list">${openI.sort((a, b) => ['Urgente', 'Haute', 'Normale', 'Basse'].indexOf(a.priorite) - ['Urgente', 'Haute', 'Normale', 'Basse'].indexOf(b.priorite)).slice(0, 4).map(i => `<div class="li"><div class="t"><b>${esc(i.titre)}</b><span>${esc(citeName(i.citeId))}${i.lieu ? ' · ' + esc(i.lieu) : ''}</span></div>${chip(i.priorite)}</div>`).join('') || '<div class="empty">Aucune intervention en cours.</div>'}</div>
        <h3 style="font-size:14px;margin:16px 0 4px">Prochaines réservations</h3>
        <div class="list">${resas.slice(0, 4).map(({e, r}) => `<div class="li"><div class="t"><b>${esc(e.nom)}</b><span>${fmtDate(r.date)}${r.debut ? ' · ' + esc(r.debut) + '–' + esc(r.fin || '') : ''} · ${esc(r.beneficiaire || '')}</span></div>${chip(r.statut)}</div>`).join('') || '<div class="empty">Aucune réservation à venir.</div>'}</div>

function barChart(rows) {
  const W = 640, H = 230, L = 48, B = 26, T = 10, R = 8;
  const max = Math.max(1, ...rows.map(r => r.t));
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
  const top = step * 4, ih = H - T - B, bw = (W - L - R) / rows.length;
  const y = v => T + ih - v / top * ih;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = step * i; g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${moneyShort(v)}</text>`; }
  rows.forEach((r, i) => {
    const x = L + i * bw + bw * .18, w = bw * .64; let acc = 0;
    [['v', 'c-v'], ['l', 'c-l'], ['a', 'c-a']].forEach(([k, cl]) => { if (r[k] > 0) { const h = r[k] / top * ih; g += `<rect class="${cl}" x="${x}" y="${y(acc + r[k])}" width="${w}" height="${Math.max(h, 1)}" rx="2"><title>${fmtMonth(r.m)} : ${nf.format(r[k])}</title></rect>`; acc += r[k]; } });
    g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${new Date(r.m + '-01T00:00').toLocaleDateString('fr-FR', {month: 'short'}).replace('.', '')}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Encaissements mensuels">${g}</svg>`;
}

function fieldHtml(f, v, prefix = 'f') {
  const id = `${prefix}_${f.k}`; const val = v ?? '';

  else if (f.t === 'ref') { const list = S[f.ref].slice().sort((a, b) => LABEL[f.ref](a).localeCompare(LABEL[f.ref](b), 'fr', {numeric: true})); input = `<select id="${id}" name="${f.k}" ${f.req ? 'required' : ''}><option value="">${list.length ? '— Choisir —' : '— Aucun enregistrement —'}</option>${list.map(x => `<option value="${x.id}" ${val === x.id ? 'selected' : ''}>${esc(LABEL[f.ref](x))}</option>`).join('')}</select>`; }
  else if (f.t === 'textarea') input = `<textarea id="${id}" name="${f.k}">${esc(val)}</textarea>`;
  else input = `<input id="${id}" name="${f.k}" type="${f.t || 'text'}" ${f.t === 'number' ? `step="${f.step || '1'}" min="0" inputmode="decimal"` : ''} value="${esc(val)}" ${f.req ? 'required' : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;
  return `<div class="fld ${f.half ? 'half' : ''}"><label for="${id}">${esc(f.l)}${f.req ? ' *' : ''}</label>${input}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
}
function readForm(form, fields) {

}

    <li>Naviguez avec le <b>menu latéral</b> (en haut sur téléphone).</li>
    <li>Chaque liste propose un bouton <b>+ Nouveau</b> pour ajouter un élément, une <b>recherche</b> et des <b>filtres</b>.</li>
    <li>Cliquez sur une ligne pour ouvrir sa <b>fiche détaillée</b> (panneau latéral), puis sur <b>Modifier</b> pour la corriger.</li>
    <li>La touche <b>Échap</b> ferme les fenêtres et panneaux.</li>
  </ul>

  <h3>Tableau de bord</h3>
  <p>Vue d’ensemble : encaissements du mois, reste à encaisser, loyers attendus et reçus, taux d’occupation, graphique des encaissements sur 12 mois et liste des <b>clients à relancer</b> (retards de paiement).</p>

  <h3>Cités &amp; programmes</h3>
  <p>Créez vos cités (étapes : étude &amp; lotissement, viabilisation, commercialisation, livrée). La fiche d’une cité affiche le <b>plan de lotissement</b> : chaque îlot est coloré selon le statut de ses lots.</p>

  <h3>Lots &amp; terrains</h3>
  <p>Chaque lot a une référence, un îlot, une surface, un prix (le prix au m² est calculé), un titre foncier et un statut. Le statut se met à jour <b>automatiquement</b> : « Vendu » après une vente, « Loué » quand un bail est actif, « Disponible » si la vente ou le bail est supprimé.</p>

  <h3>Ventes de terrains</h3>
  <ul>
    <li>Vente <b>au comptant</b> ou <b>échelonnée</b> : indiquez acompte, nombre d’échéances et date de première mensualité — l’<b>échéancier est calculé</b> automatiquement.</li>
    <li>Depuis la fiche de la vente, <b>enregistrez les paiements</b> reçus : les échéances passent de « À venir » à « Payée », « Partielle » ou « En retard ».</li>
    <li>Téléchargez le <b>relevé de compte</b> de l’acquéreur (bouton dédié dans la fiche).</li>
  </ul>

  <h3>Locations</h3>
  <ul>
    <li>Créez un <b>bail</b> : lot, locataire, loyer, charges, caution, durée.</li>
    <li>Les loyers sont suivis <b>mois par mois</b> ; les impayés apparaissent en rouge et remontent au tableau de bord.</li>
    <li>Depuis la fiche du bail : <b>Encaisser un loyer</b> (le mois et le montant sont pré-remplis) et télécharger la <b>quittance de loyer</b>.</li>
  </ul>

  <h3>Espaces communs</h3>
  <p>Salles, piscines, parkings… Définissez un tarif et enregistrez les <b>réservations</b>. L’application <b>bloque les conflits de créneaux</b> : deux réservations ne peuvent pas se chevaucher le même jour.</p>

  <h3>Syndic &amp; charges</h3>
  <p>Définissez les <b>cotisations</b> par lot, suivez le taux de recouvrement, enregistrez les <b>dépenses communes</b> et consultez le <b>solde de chaque cité</b>.</p>

  <h3>Maintenance</h3>
  <p>Suivez les interventions par étapes : <b>Signalée → Planifiée → En cours → Terminée</b> (flèches pour faire avancer). Renseignez priorité, corps de métier, prestataire et coût.</p>

  <h3>Clients &amp; tiers</h3>
  <p>Acquéreurs, locataires, propriétaires, prestataires… La liste affiche le <b>montant dû</b> par chacun. La fiche regroupe ses ventes, baux et paiements.</p>

  <h3>Paramètres</h3>
  <ul>
    <li>Réglez la <b>devise</b> et les <b>coordonnées de l’agence</b> (utilisées sur quittances et relevés).</li>
    <li><b>Sauvegarde complète</b> : téléchargez toutes vos données au format JSON. Faites-le régulièrement.</li>
    <li><b>Supprimer les exemples</b> : retire les données de démonstration sans toucher à vos saisies.</li>
  </ul>

  <h3>Exports et documents</h3>
  <p>Chaque liste s’exporte en <b>CSV</b> (séparateur « ; », compatible Excel). Quittances et relevés se téléchargent en HTML, prêts à imprimer ou enregistrer en PDF.</p>

  <h3>Vos données</h3>
  <p>Selon le mode d’ouverture, les données sont soit <b>synchronisées et partagées</b> avec votre équipe (mention « Données synchronisées » en bas du menu), soit <b>conservées dans ce navigateur</b> (« Mode local »). En mode local, pensez à la sauvegarde JSON.</p>

  <div class="formbar"><span class="sp"></span><button class="btn primary" data-a="closeModal">Fermer</button></div>
</div>`);
  $('#modalRoot .mbox')?.classList.add('wide');
}

/* ---------- interactions ---------- */
let toastT;
function toast(m) { $('#toastRoot').innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => $('#toastRoot').innerHTML = '', 3200); }

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (el.tagName === 'BUTTON' || el.closest('tr') || el.classList.contains('tk')) ev.stopPropagation();
  switch (a) {
    case 'go': go(el.dataset.v); break;
    case 'new': openForm(el.dataset.c, el.dataset.pre ? JSON.parse(el.dataset.pre) : null); break;
    case 'edit': { const r = byId(el.dataset.c, id); if (r) { if (READONLY) { toast('Votre accès est en lecture seule.'); return; } openForm(el.dataset.c, r); } break; }
    case 'open': UI.drawer = {k: el.dataset.k, id}; renderDrawer(); break;
    case 'closeDrawer': UI.drawer = null; renderDrawer(); break;
    case 'closeModal': closeModal(); break;
    case 'confirmYes': { const h = modalHandler; closeModal(); h && h(); break; }
    case 'tab': UI.f[el.dataset.k] = el.dataset.v; render(); break;
    case 'sell': { const l = byId('lots', id); openForm('ventes', {lotId: id, prix: l?.prix || ''}); break; }
    case 'rent': { const l = byId('lots', id); openForm('baux', {lotId: id, loyer: l?.loyer || ''}); break; }
    case 'del': { const col = el.dataset.c; const deps = col === 'cites' ? S.lots.some(l => l.citeId === id) : col === 'lots' ? (S.ventes.some(v => v.lotId === id) || S.baux.some(b => b.lotId === id)) : col === 'tiers' ? (S.ventes.some(v => v.tiersId === id) || S.baux.some(b => b.tiersId === id)) : false;
      if (deps) { const e = $('#formErr'); if (e) { e.hidden = false; e.textContent = col === 'cites' ? 'Cette cité contient des lots : supprimez-les ou rattachez-les ailleurs d’abord.' : 'Cet enregistrement est lié à une vente ou un bail : supprimez d’abord ceux-ci.'; } return; }
      const rec = byId(col, id);
      confirmBox(`Supprimer définitivement ${SCHEMA[col].titre} ? Cette action est irréversible.`, 'Supprimer', async () => {
        if (await remove(col, id)) {
          if (col === 'ventes' && rec) await setLotStatut(rec.lotId, 'Disponible');
          if (col === 'baux' && rec && byId('lots', rec.lotId)?.statut === 'Loué' && !S.baux.some(b => b.id !== id && b.lotId === rec.lotId && b.statut === 'Actif')) await setLotStatut(rec.lotId, 'Disponible');
          if (UI.drawer && UI.drawer.id === id) UI.drawer = null; toast('Supprimé.'); schedule();
        }
      }); break; }
    case 'payvente': { const v = byId('ventes', id); const c = venteCalc(v); openSub('ventes', id, 'paiements', PAY_FIELDS, 'Enregistrer un paiement', {date: TODAY, montant: c.next ? Math.round(c.next.montant - c.next.paye) : '', mode: 'Virement'}, it => num(it.montant) <= 0 ? 'Le montant doit être positif.' : null); break; }
    case 'payrent': { const b = byId('baux', id); const c = bailCalc(b); const due = c.first ? c.mens - c.first.p : c.mens; openSub('baux', id, 'paiements', RENT_FIELDS, `Encaisser un loyer — ${tiersName(b.tiersId)}`, {mois: c.nextMonth, montant: due, date: TODAY, mode: 'Mobile money'}, it => num(it.montant) <= 0 ? 'Le montant doit être positif.' : null); break; }
    case 'resa': case 'editresa': { const e = byId('espaces', id); const r = a === 'editresa' ? (e.reservations || []).find(x => x.id === el.dataset.p) : {date: TODAY, statut: 'Confirmée', debut: '10:00', fin: '14:00', montant: e.tarif || ''};
      openSub('espaces', id, 'reservations', RESA_FIELDS, (a === 'resa' ? 'Nouvelle réservation — ' : 'Réservation — ') + e.nom, r, (it, fresh) => {
        if (it.fin <= it.debut) return 'L’heure de fin doit suivre l’heure de début.';
        if (it.statut === 'Annulée') return null;
        const clash = (fresh.reservations || []).find(x => x.id !== it.id && x.statut !== 'Annulée' && x.date === it.date && x.debut < it.fin && it.debut < x.fin);
        return clash ? `Créneau déjà réservé par ${clash.beneficiaire} (${clash.debut}–${clash.fin}).` : null; }); break; }
    case 'delpay': case 'delsub': { const col = el.dataset.c, key = el.dataset.key || 'paiements', pid = el.dataset.p;
      confirmBox(key === 'reservations' ? 'Supprimer cette réservation ?' : 'Retirer ce paiement ? Les soldes seront recalculés.', key === 'reservations' ? 'Supprimer' : 'Retirer', async () => { const r = byId(col, id); if (r && await save(col, {...r, [key]: (r[key] || []).filter(x => x.id !== pid)})) toast('Supprimé.'); }); break; }
    case 'mv': { const cols = ['Signalée', 'Planifiée', 'En cours', 'Terminée']; const i = byId('interventions', id); const n = cols[Math.max(0, Math.min(3, cols.indexOf(i.statut || 'Signalée') + Number(el.dataset.d)))]; await save('interventions', {...i, statut: n}); break; }
    case 'quittance': { const b = byId('baux', id); const p = (b.paiements || []).find(x => x.id === el.dataset.p); if (p) download(`Quittance ${lotName(b.lotId)} ${p.mois}.html`, quittance(b, p)); break; }
    case 'releve': { const v = byId('ventes', id); download(`Releve ${lotName(v.lotId)} ${tiersName(v.tiersId)}.html`, releve(v)); break; }
    case 'csv': { const k = el.dataset.k; download(`anayah-${k}-${TODAY}.csv`, csv(CSV[k]())); break; }
    case 'backup': { const o = {exporte: new Date().toISOString(), config: CFG}; COLS.forEach(c => o[c] = S[c]); download(`anayah-gestim-sauvegarde-${TODAY}.json`, JSON.stringify(o, null, 2)); break; }
    case 'purge': { const n = COLS.reduce((s, c) => s + S[c].filter(x => x.exemple).length, 0);
      confirmBox(`Supprimer les ${n} enregistrements d’exemple ? Vos propres saisies sont conservées.`, 'Supprimer les exemples', async () => { for (const c of COLS) for (const x of S[c].filter(x => x.exemple)) { if (!await remove(c, x.id)) return; } toast('Exemples supprimés.'); }); break; }
    case 'copy': { const v = el.dataset.v; try { await navigator.clipboard.writeText(v); toast('Copié.'); } catch (e) { toast(v); } break; }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#modalRoot').innerHTML) closeModal(); else if (UI.drawer) { UI.drawer = null; renderDrawer(); } }
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('tk')) ev.target.click();
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'cfgForm') { const f = ev.target; saveCfg({societe: f.societe.value.trim(), devise: f.devise.value.trim() || 'FCFA', tel: f.tel.value.trim(), adresse: f.adresse.value.trim()}).then(() => toast('Paramètres enregistrés.')); return; }
  if (modalHandler) modalHandler(ev.target);
});
let inT;
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.f) return;
  if (el.dataset.f === 'tiersQ') UI.f.tiersQ = el.value; else { UI.f[el.dataset.f] = UI.f[el.dataset.f] || {}; UI.f[el.dataset.f][el.dataset.k] = el.value; }
  if (el.tagName === 'SELECT') { render(); return; }
  clearTimeout(inT); inT = setTimeout(() => { const pos = el.selectionStart; const id = el.id; render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }, 220);
});

/* ---------- démarrage ---------- */
async function boot() {
  render();
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  use('downloads').then(d => { DL = d; });
  DB = await use('db');
  if (DB) {
    MODE = 'cloud';
    const u = await use('user');
    if (u) { try { const w = await u.can('data.write'); if (w === false) READONLY = true; } catch (e) {} }
    COLS.forEach(c => DB.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({id: d.id, ...d.data()})); loaded.add(c); schedule(); }, e => { loaded.add(c); toast('Synchronisation interrompue. Rechargez la page.'); schedule(); }));
    DB.doc('config/app').onSnapshot(s => { if (s.exists) CFG = {...CFG, ...s.data()}; schedule(); }, () => {});
  } else { MODE = 'local'; localLoad(); COLS.forEach(c => loaded.add(c)); }
  render();
}
boot();
</script>
