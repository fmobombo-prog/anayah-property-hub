<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anayah Gestim</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12362c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anayah Gestim">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: dark cadastral sidebar + working canvas; lots drawn as parcels, status carried by colour chips */
:root{
  --paper:#eef1ee;--surface:#ffffff;--sunk:#f5f7f5;--ink:#15211f;--muted:#5b6965;--line:#d8dfdb;
  --accent:#1d5b57;--accent-2:#e2eeec;--on-accent:#ffffff;--brass:#9c6d14;--brass-2:#f4ead6;
  --side:#11302d;--side-ink:#e8f0ee;--side-muted:#8fb0ab;--side-hover:#1a403c;
  --ok:#2b7a4b;--ok-2:#e1f0e6;--warn:#a2660e;--warn-2:#f7ebd4;--bad:#b23b33;--bad-2:#f8e0dd;
  --info:#2c5d9a;--info-2:#e0e9f5;--violet:#6a4c9e;--violet-2:#ebe5f5;--mut:#6c7774;--mut-2:#e8ecea;
  --scrim:rgba(10,20,19,.42);--shadow:0 1px 2px rgba(16,32,30,.06),0 10px 30px rgba(16,32,30,.08);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1413;--surface:#151d1c;--sunk:#111817;--ink:#e3ebe8;--muted:#93a49f;--line:#27332f;
  --accent:#5bb2a6;--accent-2:#173533;--on-accent:#04201c;--brass:#d6a84a;--brass-2:#3a2e14;
  --side:#0a100f;--side-ink:#e3ebe8;--side-muted:#7c938e;--side-hover:#16211f;
  --ok:#5cc086;--ok-2:#173726;--warn:#e2a84c;--warn-2:#3b2c12;--bad:#ec7a6e;--bad-2:#3d1d1a;
  --info:#7eaae8;--info-2:#18283e;--violet:#ab92e3;--violet-2:#2a2140;--mut:#8d9a96;--mut-2:#202a28;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1413;--surface:#151d1c;--sunk:#111817;--ink:#e3ebe8;--muted:#93a49f;--line:#27332f;
  --accent:#5bb2a6;--accent-2:#173533;--on-accent:#04201c;--brass:#d6a84a;--brass-2:#3a2e14;
  --side:#0a100f;--side-ink:#e3ebe8;--side-muted:#7c938e;--side-hover:#16211f;
  --ok:#5cc086;--ok-2:#173726;--warn:#e2a84c;--warn-2:#3b2c12;--bad:#ec7a6e;--bad-2:#3d1d1a;
  --info:#7eaae8;--info-2:#18283e;--violet:#ab92e3;--violet-2:#2a2140;--mut:#8d9a96;--mut-2:#202a28;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;color:var(--side-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:18px}
.nav .grp{display:flex;flex-direction:column;gap:2px}
.nav .gl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:0 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);font-size:14px;opacity:.86}
.nav button:hover{background:var(--side-hover);opacity:1}
.nav button[aria-current="page"]{background:var(--side-hover);opacity:1;box-shadow:inset 3px 0 0 var(--brass)}
.nav button:focus-visible{outline:2px solid var(--brass)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 10px;display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}
.dot.local{background:var(--warn)}

.main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:28px 60px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:0 0 4px}
.top h1{font-size:clamp(24px,3vw,32px)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{border:1px solid var(--line);background:var(--warn-2);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:13.5px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.panel h2{font-size:17px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
@media (max-width:1050px){.g-2{grid-template-columns:minmax(0,1fr)}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hl{background:var(--side);border-color:var(--side);color:var(--side-ink)}
.kpi.hl .l,.kpi.hl .s{color:var(--side-muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--mut-2);color:var(--mut)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{background:var(--ok-2);color:var(--ok)}.s-warn{background:var(--warn-2);color:var(--warn)}.s-bad{background:var(--bad-2);color:var(--bad)}
.s-info{background:var(--info-2);color:var(--info)}.s-violet{background:var(--violet-2);color:var(--violet)}.s-mut{background:var(--mut-2);color:var(--mut)}
.ex{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);border:1px dashed var(--brass);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td .sub{display:block;color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:4px;background:var(--mut-2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13.5px;min-width:0}
.filters input{flex:1 1 200px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent-2);color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--muted)}
.card h3{font-size:17px}
.card .meta{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-variant-numeric:tabular-nums;font-size:14.5px}
.stack{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--mut-2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.f-Disponible{background:var(--ok)}.f-Réservé{background:var(--warn)}.f-Vendu{background:var(--info)}.f-Loué{background:var(--violet)}.f-Indisponible{background:var(--mut)}

.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.li .t span{color:var(--muted);font-size:12.5px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:17px}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line)}
.c-v{fill:var(--accent)}.c-l{fill:var(--brass)}.c-a{fill:var(--info)}
.lg-v{background:var(--accent)}.lg-l{background:var(--brass)}.lg-a{background:var(--info)}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font-size:14px;display:flex;justify-content:space-between}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.tk b{font-size:14px;overflow-wrap:anywhere}
.tk .meta{font-size:12px;color:var(--muted)}
.tk .row{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}

.plan{display:flex;flex-direction:column;gap:10px}
.ilot{display:flex;gap:10px;align-items:flex-start}
.ilot>span{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:56px;flex:none;padding-top:8px}
.plots{display:flex;flex-wrap:wrap;gap:4px}
.plot{all:unset;cursor:pointer;width:44px;height:34px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:#fff;font-weight:600;outline-offset:2px}
.plot:focus-visible{outline:2px solid var(--ink)}
.plot:hover{filter:brightness(1.1)}

.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.mo{border-radius:8px;padding:6px 8px;font-size:11.5px;display:flex;flex-direction:column;gap:2px}
.mo b{font-size:12px}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line)}
.dh{padding:18px 22px;padding-top:calc(18px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{font-size:21px}
.db{padding:18px 22px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.db h3{font-size:15px;margin-bottom:8px}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:20px;color:var(--muted);flex:none}
.x:hover{background:var(--sunk)}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
.modal>.scrim{z-index:0}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(640px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:22px;box-shadow:var(--shadow);position:relative;z-index:25}
.mbox.wide{width:min(760px,100%)}
.mbox h2{font-size:20px;margin-bottom:14px}
.helpbtn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--sunk);color:var(--muted);font-size:16px;font-weight:700;flex:none}
.helpbtn:hover{color:var(--ink);border-color:var(--brass)}
.helpbtn:focus-visible{outline:2px solid var(--brass)}
.man h3{font-size:14.5px;margin:18px 0 6px;color:var(--ink)}
.man h3:first-of-type{margin-top:6px}
.man p,.man li{font-size:13.5px;line-height:1.55;color:var(--muted)}
.man ul{margin:4px 0 0;padding-left:18px}
.man b{color:var(--ink)}
.form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.fld.half{grid-column:auto}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:9px 11px;font-size:14px;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--muted)}
.formbar{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.err{color:var(--bad);font-size:13px;margin-top:10px}
@media (max-width:560px){.form .grid2{grid-template-columns:1fr}.fld.half{grid-column:1/-1}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:40;max-width:calc(100% - 32px)}

.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sumrow div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.sumrow span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sumrow b{font-variant-numeric:tabular-nums;font-size:16px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:10;padding:12px 16px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav .grp{flex-direction:row;gap:4px}
  .nav .gl{display:none}
  .nav button{white-space:nowrap;padding:7px 10px;font-size:13px}
  .side .foot{display:none}
  .main{padding-block:20px 50px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

/* Connexion, abonnements, équipe, console */
.app[hidden]{display:none}
.gate{min-height:100%;display:grid;place-items:center;padding:32px 16px;background:var(--side)}
.gbox{background:var(--surface);color:var(--ink);border-radius:18px;padding:28px;width:min(440px,100%);display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.gbox .brand{padding:0}
.gbox .brand small{color:var(--brass)}
.gbox h2{font-size:22px}
.gbox p{margin:0;color:var(--muted);font-size:14px}
.gbox .form .grid2{grid-template-columns:1fr}
.gbox .btn.primary{width:100%;justify-content:center;padding:11px 14px}
.glinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}
.gmsg{font-size:13.5px;padding:10px 12px;border-radius:9px}
.gmsg.bad{background:var(--bad-2);color:var(--bad)}
.gmsg.ok{background:var(--ok-2);color:var(--ok)}
.side-link{all:unset;cursor:pointer;color:var(--side-ink);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.banner.info{background:var(--info-2)}
.banner.bad{background:var(--bad-2)}
.banner .link{margin-left:6px}
.g-plans{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plan.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.plan h3{font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan .price{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.plan .price small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.plan ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.plan .btn{margin-top:auto;justify-content:center}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .ml{display:flex;justify-content:space-between;font-size:13px}
.meter .ml span{color:var(--muted)}
.meter .sub{font-size:12px;color:var(--muted)}
.instr{background:var(--brass-2);border-radius:10px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;margin-bottom:14px}
.big{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.upsell{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
</style>
</head>
<body>

<div id="gate" hidden></div>
<div class="app" id="app">

function venteCalc(v) {
  const prix = num(v.prix), ac = Math.min(num(v.acompte), prix);
  const paid = (v.paiements || []).reduce((s, p) => s + num(p.montant), 0);
  const sched = [];
  if (v.mode === 'Échelonné' && num(v.nbEcheances) > 0) {
    const n = Math.round(num(v.nbEcheances)), rest = prix - ac, base = Math.floor(rest / n);
    if (ac > 0) sched.push({label: 'Acompte', date: v.date || TODAY, montant: ac});
    const start = v.premiere || addMonths(v.date || TODAY, 1);
    for (let i = 0; i < n; i++) sched.push({label: `Mensualité ${i + 1}/${n}`, date: addMonths(start, i), montant: i === n - 1 ? rest - base * (n - 1) : base});
  } else sched.push({label: 'Paiement comptant', date: v.date || TODAY, montant: prix});
  let pool = paid;
  sched.forEach(e => { const c = Math.min(pool, e.montant); pool -= c; e.paye = c; e.etat = c >= e.montant - .5 ? 'Payée' : e.date <= TODAY ? (c > 0 ? 'Partielle' : 'En retard') : (c > 0 ? 'Partielle' : 'À venir'); });
  const du = sched.filter(e => e.date <= TODAY).reduce((s, e) => s + e.montant, 0);
  const retard = Math.max(0, du - paid), reste = Math.max(0, prix - paid);
  const statut = reste <= .5 ? 'Soldé' : retard > .5 ? 'En retard' : 'En cours';
  return {prix, paid, reste, retard, sched, statut, next: sched.find(e => e.etat !== 'Payée'), ratio: prix ? Math.min(1, paid / prix) : 0};
}
function bailCalc(b) {
  const mens = num(b.loyer) + num(b.charges);
  const startM = (b.debut || TODAY).slice(0, 7);
  let endM = THIS_MONTH;
  if (num(b.duree) > 0) { const f = addMonths(b.debut || TODAY, num(b.duree) - 1).slice(0, 7); if (f < endM) endM = f; }
  if (b.statut !== 'Actif' && b.resil) { const r = b.resil.slice(0, 7); if (r < endM) endM = r; }
  const months = startM <= endM ? monthsBetween(startM, endM) : [];
  const paidBy = {}; (b.paiements || []).forEach(p => paidBy[p.mois] = (paidBy[p.mois] || 0) + num(p.montant));
  const rows = months.map(m => { const p = paidBy[m] || 0; return {m, p, etat: p >= mens - .5 ? 'Payé' : p > 0 ? 'Partiel' : 'Impayé'}; });
  const du = months.length * mens, paidIn = rows.reduce((s, r) => s + r.p, 0);
  const paid = (b.paiements || []).reduce((s, p) => s + num(p.montant), 0);
  const impaye = Math.max(0, du - paidIn);
  const first = rows.find(r => r.etat !== 'Payé');
  const nextMonth = first ? first.m : addMonths((months[months.length - 1] || startM) + '-01', months.length ? 1 : 0).slice(0, 7);
  const actifCeMois = b.statut === 'Actif' && startM <= THIS_MONTH && months.includes(THIS_MONTH);
  return {mens, rows, du, paid, impaye, first, nextMonth, actifCeMois, nbImp: rows.filter(r => r.etat !== 'Payé').length};
}

  const chart = barChart(agg);

    ...bc.filter(x => x.c.impaye > .5).map(x => ({k: 'bail', id: x.b.id, who: tiersName(x.b.tiersId), what: `Loyer · ${lotName(x.b.lotId)} — ${x.c.nbImp} mois`, m: x.c.impaye})),

  const resas = [];

  resas.sort((a, b) => (a.r.date + (a.r.debut || '')).localeCompare(b.r.date + (b.r.debut || '')));

  return {actions: `${addBtn('ventes')}${READONLY ? '' : `<button class="btn" data-a="new" data-c="baux">+ Nouveau bail</button>`}`, html: `
  <div class="grid" style="gap:16px">
    <div class="grid g-kpi">
      <div class="kpi hl"><span class="l">Encaissé en ${esc(fmtMonth(THIS_MONTH))}</span><span class="v">${money(moisEnc)}</span><span class="s">Ventes, loyers, cotisations et réservations</span></div>
      <div class="kpi"><span class="l">Reste à encaisser · ventes</span><span class="v">${money(resteV)}</span><span class="s">${retardV > .5 ? `<span style="color:var(--bad);font-weight:600">${money(retardV)} en retard</span>` : 'Aucune échéance en retard'}</span></div>
      <div class="kpi"><span class="l">Loyers du mois</span><span class="v">${money(encL)}</span><span class="s">sur ${money(attendus)} attendus · impayés cumulés ${money(impL)}</span></div>
      <div class="kpi"><span class="l">Occupation locative</span><span class="v">${parc ? pct(loues / parc) : '—'}</span><span class="s">${loues} bien(s) loué(s) sur ${parc} en location</span></div>
    </div>
    <div class="grid g-2">
      <section class="panel"><div class="ph"><h2>Encaissements des 12 derniers mois</h2><div class="legend"><span><i class="lg-v"></i>Ventes</span><span><i class="lg-l"></i>Loyers</span><span><i class="lg-a"></i>Syndic & espaces</span></div></div><div class="chart">${chart}</div></section>
      <section class="panel"><div class="ph"><h2>À relancer</h2><p>Retards de paiement</p></div>
        ${relances.length ? `<div class="list">${relances.map(r => `<div class="li"><div class="t"><b>${esc(r.who)}</b><span>${esc(r.what)}</span></div><button class="btn sm" data-a="open" data-k="${r.k}" data-id="${r.id}" style="color:var(--bad)">${money(r.m)}</button></div>`).join('')}</div>` : '<div class="empty">Aucun retard. Tous les comptes sont à jour.</div>'}
      </section>
    </div>
    <div class="grid g-2">

        <h3 style="font-size:14px;margin:16px 0 4px">Prochaines réservations</h3>
        <div class="list">${resas.slice(0, 4).map(({e, r}) => `<div class="li"><div class="t"><b>${esc(e.nom)}</b><span>${fmtDate(r.date)}${r.debut ? ' · ' + esc(r.debut) + '–' + esc(r.fin || '') : ''} · ${esc(r.beneficiaire || '')}</span></div>${chip(r.statut)}</div>`).join('') || '<div class="empty">Aucune réservation à venir.</div>'}</div>
      </section>
    </div>
  </div>`};
}
function barChart(rows) {
  const W = 640, H = 230, L = 48, B = 26, T = 10, R = 8;
  const max = Math.max(1, ...rows.map(r => r.t));
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
  const top = step * 4, ih = H - T - B, bw = (W - L - R) / rows.length;
  const y = v => T + ih - v / top * ih;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = step * i; g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${moneyShort(v)}</text>`; }
  rows.forEach((r, i) => {
    const x = L + i * bw + bw * .18, w = bw * .64; let acc = 0;
    [['v', 'c-v'], ['l', 'c-l'], ['a', 'c-a']].forEach(([k, cl]) => { if (r[k] > 0) { const h = r[k] / top * ih; g += `<rect class="${cl}" x="${x}" y="${y(acc + r[k])}" width="${w}" height="${Math.max(h, 1)}" rx="2"><title>${fmtMonth(r.m)} : ${nf.format(r[k])}</title></rect>`; acc += r[k]; } });
    g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${new Date(r.m + '-01T00:00').toLocaleDateString('fr-FR', {month: 'short'}).replace('.', '')}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Encaissements mensuels">${g}</svg>`;
}

async function download(filename, data) {
  if (!DL) {
    if (window.claude) { toast('Le téléchargement n’est pas disponible dans cette vue.'); return; }
    const ext = filename.split('.').pop(); const type = {csv: 'text/csv', json: 'application/json', html: 'text/html'}[ext] || 'text/plain';
    const url = URL.createObjectURL(new Blob([data], {type: type + ';charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Fichier téléchargé.'); return;
  }
  try { await DL.save({filename, data}); toast('Fichier prêt.'); }
  catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') toast('Une demande de téléchargement est déjà ouverte.'); else toast('Téléchargement impossible dans cette vue.'); }
}

function quittance(b, p) {
  const t = byId('tiers', b.tiersId) || {}; const l = byId('lots', b.lotId) || {};
  const loyer = num(b.loyer), ch = num(b.charges), tot = loyer + ch;
  return docShell('Quittance de loyer', `<h1>Quittance de loyer</h1><p class="mut">Période : ${fmtMonth(p.mois)}</p>
  <p>Je soussigné(e), ${esc(CFG.societe || 'le gestionnaire')}, déclare avoir reçu de <strong>${esc(t.nom || '')}</strong> la somme de <strong>${money(p.montant)}</strong>, au titre du loyer et des charges du bien <strong>${esc(l.ref || '')}</strong> (${esc(l.type || '')}) situé dans la cité ${esc(citeName(l.citeId))}, pour la période de ${fmtMonth(p.mois)}.</p>
  <table><tr><th>Détail</th><th class="n">Montant</th></tr><tr><td>Loyer</td><td class="n">${money(loyer)}</td></tr><tr><td>Charges</td><td class="n">${money(ch)}</td></tr><tr class="tot"><td>Total dû pour la période</td><td class="n">${money(tot)}</td></tr><tr><td>Montant reçu le ${fmtDate(p.date)} (${esc(p.mode || '')})</td><td class="n">${money(p.montant)}</td></tr></table>

  <div class="sig"><span>Fait le ${fmtDate(TODAY)}</span><span>Signature du bailleur ou mandataire</span></div>`);

function releve(v) {

  <div class="formbar"><span class="sp"></span><button class="btn primary" data-a="closeModal">Fermer</button></div>
</div>`);
  $('#modalRoot .mbox')?.classList.add('wide');

function gateMsg(msg, ok) { const el = $('#gateMsg'); if (!el) return; el.hidden = false; el.className = 'gmsg ' + (ok ? 'ok' : 'bad'); el.textContent = msg; }
function authErr(e) {
  const t = (e && e.message) || '';
  if (/invalid login/i.test(t)) return 'Adresse e-mail ou mot de passe incorrect.';
  if (/not confirmed/i.test(t)) return 'Confirmez d’abord votre adresse grâce au lien reçu par e-mail.';
  if (/already registered|already been registered/i.test(t)) return 'Un compte existe déjà avec cette adresse. Connectez-vous.';
  if (/password/i.test(t) && /(least|short|weak)/i.test(t)) return 'Mot de passe trop faible : 8 caractères minimum.';
  if (/rate limit|too many/i.test(t)) return 'Trop de tentatives. Patientez quelques minutes.';
  return sbError(e);
}

async function sbStart() {
  SB = window.supabase.createClient(SBCFG.supabaseUrl, SBCFG.supabaseAnonKey);
  MODE = 'auth'; showGate('loading');
  SB.auth.onAuthStateChange((ev, s) => {
    if (ev === 'PASSWORD_RECOVERY') { RECOVERY = true; SESSION = s; showGate('newpass'); return; }
    if (ev === 'SIGNED_OUT') { resetSession(); showGate('login'); return; }
    if ((ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION') && s) setTimeout(() => enterSession(s), 0);
  });
  const {data, error} = await SB.auth.getSession();
  if (error) { showGate('error', sbError(error)); return; }
  if (data.session) enterSession(data.session); else if (!RECOVERY) showGate('login');
}
function resetSession() {
  if (CHAN) { try { SB.removeChannel(CHAN); } catch (e) {} CHAN = null; }
  SESSION = null; SESSION_UID = null; AGENCE = null; ETAT = null; SUPER = false; MES_AGENCES = []; CONSOLE = null;
  ABO = {plans: [], paiements: []}; EQUIPE = {membres: [], invitations: []};
  COLS.forEach(c => S[c] = []); loaded.clear(); MODE = 'auth'; READONLY = false;
}
async function enterSession(s) {
  if (!s || SESSION_UID === s.user.id) return;
  SESSION = s;
  if (RECOVERY) { showGate('newpass'); return; }
  SESSION_UID = s.user.id;
  showGate('loading');
  await SB.rpc('accepter_invitations');
  const sa = await SB.rpc('est_super_admin'); SUPER = !!sa.data;
  await loadAgences();
}
async function loadAgences(prefer) {
  const {data, error} = await SB.from('membres').select('role, agence:agences(*)').eq('user_id', SESSION.user.id);
  if (error) { showGate('error', sbError(error)); return; }
  MES_AGENCES = (data || []).filter(r => r.agence).map(r => ({...r.agence, role: r.role}));
  if (!MES_AGENCES.length) { showGate('onboarding'); return; }
  let id = prefer; if (!id) { try { id = localStorage.getItem('anayah-agence'); } catch (e) {} }
  await selectAgence(MES_AGENCES.find(a => a.id === id) || MES_AGENCES[0]);
}
async function selectAgence(ag) {
  AGENCE = ag; try { localStorage.setItem('anayah-agence', ag.id); } catch (e) {}
  CFG = {devise: ag.devise || 'FCFA', societe: ag.nom, tel: ag.tel || '', adresse: ag.adresse || ''};
  MODE = 'supabase'; ETAT = null; COLS.forEach(c => S[c] = []); loaded.clear();
  hideGate(); render();
  await refreshEtat();
  await sbLoadAll(); sbSubscribe();
  refreshAbo(); refreshEquipe(); if (SUPER) refreshConsole();
  render();
}
async function refreshEtat() {
  if (!AGENCE) return;
  const {data, error} = await SB.rpc('etat_agence', {a: AGENCE.id});
  if (error) { toast(sbError(error)); return; }
  ETAT = data; READONLY = !ETAT || ETAT.role === 'lecture' || ETAT.statut === 'expire';
  schedule();
}
let etatT; function refreshEtatSoon() { clearTimeout(etatT); etatT = setTimeout(refreshEtat, 1200); }
async function sbLoadAll() {
  COLS.forEach(c => S[c] = []); loaded.clear();
  for (let from = 0; ; from += 1000) {
    const {data, error} = await SB.from('enregistrements').select('collection,id,data').eq('agence_id', AGENCE.id).order('collection').order('id').range(from, from + 999);
    if (error) { toast(sbError(error)); break; }
    data.forEach(r => { if (S[r.collection]) S[r.collection].push({id: r.id, ...r.data}); });
    if (data.length < 1000) break;
  }
  COLS.forEach(c => loaded.add(c));
}
function sbSubscribe() {
  if (CHAN) { try { SB.removeChannel(CHAN); } catch (e) {} }
  const agId = AGENCE.id;
  const onChange = p => {
    const r = p.eventType === 'DELETE' ? p.old : p.new;
    if (!AGENCE || AGENCE.id !== agId || !r || r.agence_id !== agId || !S[r.collection]) return;
    if (p.eventType === 'DELETE') S[r.collection] = S[r.collection].filter(x => x.id !== r.id);
    else upsertLocal(r.collection, {id: r.id, ...r.data});
    schedule();
  };
  const base = {schema: 'public', table: 'enregistrements'};
  CHAN = SB.channel('enr-' + agId)
    .on('postgres_changes', {...base, event: 'INSERT', filter: 'agence_id=eq.' + agId}, onChange)
    .on('postgres_changes', {...base, event: 'UPDATE', filter: 'agence_id=eq.' + agId}, onChange)
    .on('postgres_changes', {...base, event: 'DELETE'}, onChange)
    .subscribe();
}
async function refreshAbo() {
  if (!AGENCE) return;
  const [p, pa] = await Promise.all([SB.from('plans').select('*').eq('actif', true).order('ordre'), SB.from('paiements_abonnement').select('*').eq('agence_id', AGENCE.id).order('declare_le', {ascending: false})]);
  ABO = {plans: p.data || [], paiements: pa.data || []}; schedule();
}
async function refreshEquipe() {
  if (!AGENCE) return;
  const [m, i] = await Promise.all([SB.from('membres').select('*').eq('agence_id', AGENCE.id).order('ajoute_le'), isAdmin() ? SB.from('invitations').select('*').eq('agence_id', AGENCE.id).order('invite_le') : Promise.resolve({data: []})]);
  EQUIPE = {membres: m.data || [], invitations: i.data || []}; schedule();
}
async function refreshConsole() {
  if (!SUPER) return;
  const [a, p, pl, pr] = await Promise.all([SB.rpc('console_agences'), SB.from('paiements_abonnement').select('*, agence:agences(nom)').order('declare_le', {ascending: false}).limit(500), SB.from('plans').select('*').order('ordre'), SB.from('parametres_ydila').select('*').eq('id', 1).single()]);
  if (a.error) { toast(sbError(a.error)); return; }
  CONSOLE = {agences: a.data || [], paiements: p.data || [], plans: pl.data || [], params: pr.data || {}}; schedule();
}
async function rpc(name, args, okMsg) {
  const {data, error} = await SB.rpc(name, args);
  if (error) { toast(sbError(error)); return null; }
  if (okMsg) toast(okMsg);
  return data ?? true;
}

function openDeclare(code) {

async function importData(o) {
  let n = 0;
  for (const c of COLS) {
    const arr = Array.isArray(o[c]) ? o[c] : [];
    if (MODE === 'supabase') {
      for (let i = 0; i < arr.length; i += 500) {
        const rows = arr.slice(i, i + 500).map(r => { const {id, ...d} = r; return {agence_id: AGENCE.id, collection: c, id: String(id || uid()), data: d}; });
        const {error} = await SB.from('enregistrements').upsert(rows);
        if (error) {
          if (!o.__tolerant) { toast(sbError(error) + ` (${n} importé(s) avant l’erreur)`); await sbLoadAll(); refreshEtat(); schedule(); return; }
          for (const row of rows) { const r2 = await SB.from('enregistrements').upsert(row); if (r2.error) { o.__errs = (o.__errs || []); o.__errs.push(sbError(r2.error)); } else n++; }
          continue;
        }
        n += rows.length;
      }
    } else for (const r of arr) { if (!(await save(c, r))) return; n++; }
  }
  if (MODE === 'supabase') { await sbLoadAll(); refreshEtat(); }
  if (o.config && !READONLY && isAdmin()) await saveCfg({devise: o.config.devise || CFG.devise, tel: o.config.tel || CFG.tel, adresse: o.config.adresse || CFG.adresse});
  toast(o.__errs && o.__errs.length ? `${n} enregistrement(s) chargé(s), ${o.__errs.length} ignoré(s) : ${o.__errs[0]}` : `${n} enregistrement(s) importé(s).`); schedule();
}

    case 'gate': showGate(el.dataset.v); break;
    case 'reload': location.reload(); break;
    case 'logout': if (SB) { await SB.auth.signOut(); } break;
    case 'switchAg': modal(`<h2>Changer d’agence</h2><div class="list">${MES_AGENCES.map(ag => `<div class="li"><div class="t"><b>${esc(ag.nom)}</b><span>${esc(ROLES[ag.role] || '')}</span></div>${AGENCE && ag.id === AGENCE.id ? '<span class="chip s-info">Actuelle</span>' : `<button class="btn sm" data-a="pickAg" data-id="${ag.id}">Ouvrir</button>`}</div>`).join('')}</div><div class="formbar"><span class="sp"></span><button class="btn ghost" data-a="closeModal">Fermer</button></div>`); break;
    case 'pickAg': { const ag = MES_AGENCES.find(x => x.id === id); closeModal(); if (ag) { UI.view = 'dashboard'; await selectAgence(ag); } break; }
    case 'choosePlan': openDeclare(el.dataset.code); break;
    case 'rmMember': { const self = id === SESSION?.user?.id;
      confirmBox(self ? 'Quitter cette agence ? Vous perdrez l’accès à ses données.' : `Retirer ${esc(el.dataset.v)} de l’agence ? Ses saisies sont conservées.`, self ? 'Quitter' : 'Retirer', async () => { if (await rpc('retirer_membre', {a: AGENCE.id, p_user: id}, self ? 'Vous avez quitté l’agence.' : 'Membre retiré.')) { if (self) { SESSION_UID = null; enterSession(SESSION); } else refreshEquipe(); refreshEtat(); } }); break; }
    case 'rmInvit': if (await rpc('annuler_invitation', {a: AGENCE.id, p_email: el.dataset.v}, 'Invitation annulée.')) { refreshEquipe(); refreshEtat(); } break;
    case 'consoleRefresh': refreshConsole(); break;
    case 'editPlan': openPlanEdit(el.dataset.code); break;
    case 'editYParams': openYParams(); break;
    case 'valider': { const p = CONSOLE.paiements.find(x => x.id === id); if (!p) break;
      modal(`<h2>Valider le paiement</h2><p style="margin:0">${esc(p.agence?.nom || '')} · ${nf.format(p.montant)} ${esc(CONSOLE.params.devise || 'FCFA')} · réf. <span class="mono">${esc(p.reference || '')}</span></p><p style="margin:10px 0 0;color:var(--muted)">L’abonnement sera prolongé de ${p.cycle === 'annuel' ? '12 mois' : '1 mois'} sur la formule ${esc(CONSOLE.plans.find(x => x.code === p.plan_code)?.nom || p.plan_code)}.</p><div class="formbar"><span class="sp"></span><button class="btn ghost" data-a="closeModal">Annuler</button><button class="btn primary" data-a="confirmYes">Valider</button></div>`);
      modalHandler = async () => { if (await rpc('valider_paiement', {p: id}, 'Paiement validé, abonnement prolongé.')) { refreshConsole(); refreshEtat(); refreshAbo(); } }; break; }
    case 'rejeter': modal(`<form id="rejForm" class="form" novalidate><h2>Rejeter le paiement</h2><div class="grid2"><div class="fld"><label for="r_motif">Motif (visible par l’agence)</label><input id="r_motif" name="motif" placeholder="Référence introuvable, montant incomplet…"></div></div><div class="formbar"><span class="sp"></span><button type="button" class="btn ghost" data-a="closeModal">Annuler</button><button class="btn primary" style="background:var(--bad);border-color:var(--bad);color:#fff">Rejeter</button></div></form>`, async form => { if (await rpc('rejeter_paiement', {p: id, p_motif: form.motif.value}, 'Paiement rejeté.')) { closeModal(); refreshConsole(); } }); break;
    case 'importPick': { const inp = $('#importFile'); if (inp) inp.click(); break; }
    case 'copy': { const v = el.dataset.v; try { await navigator.clipboard.writeText(v); toast('Copié.'); } catch (e) { toast(v); } break; }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#modalRoot').innerHTML) closeModal(); else if (UI.drawer) { UI.drawer = null; renderDrawer(); } }
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('tk')) ev.target.click();
});
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target, id = f.id;
  if (id === 'cfgForm') { if ((await saveCfg({societe: f.societe.value.trim(), devise: f.devise.value.trim() || 'FCFA', tel: f.tel.value.trim(), adresse: f.adresse.value.trim()})) !== false) toast('Paramètres enregistrés.'); return; }
  const btn = f.querySelector('button.primary'); const busy = b => { if (btn) btn.disabled = b; };
  if (id === 'loginForm') { busy(true); const {error} = await SB.auth.signInWithPassword({email: f.email.value.trim(), password: f.password.value}); busy(false); if (error) gateMsg(authErr(error)); return; }
  if (id === 'signupForm') {
    if (f.password.value.length < 8) { gateMsg('Mot de passe trop court : 8 caractères minimum.'); return; }
    if (f.password.value !== f.confirm.value) { gateMsg('Les deux mots de passe ne correspondent pas.'); return; }
    busy(true); const {data, error} = await SB.auth.signUp({email: f.email.value.trim(), password: f.password.value, options: {emailRedirectTo: location.origin + location.pathname}}); busy(false);
    if (error) { gateMsg(authErr(error)); return; }
    if (!data.session) gateMsg(`Compte créé. Ouvrez le lien de confirmation envoyé à ${f.email.value.trim()}, puis connectez-vous.`, true);
    return;
  }
  if (id === 'resetForm') { busy(true); const {error} = await SB.auth.resetPasswordForEmail(f.email.value.trim(), {redirectTo: location.origin + location.pathname}); busy(false); if (error) gateMsg(authErr(error)); else gateMsg('Si un compte existe pour cette adresse, un lien vient de lui être envoyé.', true); return; }
  if (id === 'newpassForm') {
    if (f.password.value.length < 8) { gateMsg('Mot de passe trop court : 8 caractères minimum.'); return; }
    if (f.password.value !== f.confirm.value) { gateMsg('Les deux mots de passe ne correspondent pas.'); return; }
    busy(true); const {error} = await SB.auth.updateUser({password: f.password.value}); busy(false);
    if (error) { gateMsg(authErr(error)); return; }
    RECOVERY = false; try { history.replaceState(null, '', location.pathname); } catch (e) {}
    const {data} = await SB.auth.getSession(); SESSION_UID = null; if (data.session) enterSession(data.session); else showGate('login');
    return;
  }
  if (id === 'onboardForm') {
    busy(true); const {data, error} = await SB.rpc('creer_agence', {p_nom: f.nom.value.trim(), p_devise: f.devise.value.trim() || 'FCFA'}); busy(false);
    if (error) { gateMsg(sbError(error)); return; }
    UI.view = 'dashboard'; await loadAgences(data); return;
  }
  if (id === 'inviteForm') {
    busy(true); const r = await rpc('inviter_membre', {a: AGENCE.id, p_email: f.email.value.trim(), p_role: f.role.value}); busy(false);
    if (r) { toast(r === 'ajoute' ? 'Utilisateur ajouté à l’agence.' : 'Invitation enregistrée : l’accès sera donné dès que la personne créera son compte avec cette adresse.'); f.reset(); refreshEquipe(); refreshEtat(); }
    return;
  }
  if (modalHandler) modalHandler(f);
});
document.addEventListener('change', ev => {
  if (ev.target.id !== 'importFile' || !ev.target.files[0]) return;
  const file = ev.target.files[0]; ev.target.value = '';
  file.text().then(t => {
    let o; try { o = JSON.parse(t); } catch (e) { toast('Ce fichier n’est pas une sauvegarde Anayah Gestim valide.'); return; }
    const n = COLS.reduce((s, c) => s + (Array.isArray(o[c]) ? o[c].length : 0), 0);
    if (!n) { toast('Aucun enregistrement trouvé dans ce fichier.'); return; }
    confirmBox(`Importer ${n} enregistrement(s) depuis « ${esc(file.name)} » ? Ceux qui ont le même identifiant seront remplacés.`, 'Importer', () => importData(o));
  });
});
let inT;
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.f) return;
  if (el.dataset.f === 'tiersQ') UI.f.tiersQ = el.value; else { UI.f[el.dataset.f] = UI.f[el.dataset.f] || {}; UI.f[el.dataset.f][el.dataset.k] = el.value; }
  if (el.tagName === 'SELECT') { render(); return; }
  clearTimeout(inT); inT = setTimeout(() => { const pos = el.selectionStart; const id = el.id; render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }, 220);
});

/* ---------- démarrage ---------- */
async function boot() {
  if (SBCFG.supabaseUrl && SBCFG.supabaseAnonKey) {
    if (window.supabase && window.supabase.createClient) { try { await sbStart(); return; } catch (e) { console.error(e); } }
    toast('Service en ligne injoignable : passage en mode local.');
  }
  render();
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  use('downloads').then(d => { DL = d; });
  DB = await use('db');
  if (DB) {
    MODE = 'cloud';
    const u = await use('user');
    if (u) { try { const w = await u.can('data.write'); if (w === false) READONLY = true; } catch (e) {} }
    COLS.forEach(c => DB.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({id: d.id, ...d.data()})); loaded.add(c); schedule(); }, e => { loaded.add(c); toast('Synchronisation interrompue. Rechargez la page.'); schedule(); }));
    DB.doc('config/app').onSnapshot(s => { if (s.exists) CFG = {...CFG, ...s.data()}; schedule(); }, () => {});
  } else { MODE = 'local'; localLoad(); COLS.forEach(c => loaded.add(c)); }
  render();
}
boot();
</script>
</body>
